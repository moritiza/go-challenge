services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: es-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - configs/app.env
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: es-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
    driver: local

networks:
  app:
    driver: bridge
